<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- just basic seo stuff -->

    <!-- title tag for browser tabs -->
    <title>Cevdet Baran Oral | Full-Stack Developer Portfolio</title>

    <!-- this is what shows up on google search results -->
    <meta
      name="description"
      content="Full-stack developer portfolio - SaaS, AI products, and cloud systems. React, Node.js, Python, AWS. Teknofest finalist, 26+ projects shipped."
    />

    <!-- tell the bots it's okay to index this site -->
    <meta name="robots" content="index, follow" />

    <!-- the main link so google doesnt get confused -->
    <link rel="canonical" href="https://cevdetbaran.com/" />

    <!-- social media preview tags (og) -->

    <!-- it's a website -->
    <meta property="og:type" content="website" />

    <!-- the big headline on social share cards -->
    <meta
      property="og:title"
      content="Cevdet Baran Oral - Full-Stack Developer & Cloud Systems"
    />

    <!-- text that goes under the title when sharing -->
    <meta
      property="og:description"
      content="Full-stack developer portfolio - SaaS, AI products, and cloud systems. React, Node.js, Python, AWS. Teknofest finalist, 26+ projects shipped."
    />

    <!-- the main preview image for shares -->
    <meta
      property="og:image"
      content="https://cevdetbaran.com/assets/banner_1200x630.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- describe the pic for accessibility -->
    <meta
      property="og:image:alt"
      content="Cevdet Baran Oral portfolio banner - full-stack developer specializing in AI and cloud systems"
    />

    <!-- where to go when they click the share card -->
    <meta property="og:url" content="https://cevdetbaran.com/" />

    <!-- how the site name looks in previews -->
    <meta property="og:site_name" content="Cevdet Baran Oral" />

    <!-- telling them the site is in english -->
    <meta property="og:locale" content="en_US" />

    <!-- twitter card specific stuff -->

    <!-- use the big image card layout for twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- title for twitter cards -->
    <meta
      name="twitter:title"
      content="Cevdet Baran Oral - Full-Stack Developer & Cloud Systems"
    />

    <!-- short snippet for twitter -->
    <meta
      name="twitter:description"
      content="SaaS platforms, AI products & cloud systems. React · Node.js · Python · AWS. Teknofest finalist, 26+ projects shipped."
    />

    <!-- optimized image for twitter -->
    <meta
      name="twitter:image"
      content="https://cevdetbaran.com/assets/banner_1200x630.jpg"
    />

    <!-- alt text for twitter image -->
    <meta
      name="twitter:image:alt"
      content="Cevdet Baran Oral portfolio banner - full-stack developer specializing in AI and cloud systems"
    />

    <!-- favicon and mobile status bar -->

    <!-- tiny icon in the tab -->
    <link rel="icon" type="image/webp" href="/favicon.webp" />

    <!-- icon for when people save it to home screen -->
    <link rel="apple-touch-icon" href="/favicon.webp" />

    <!-- matches the browser status bar to my theme color -->
    <meta name="theme-color" content="#0f172a" />

    <!-- just loading some external stuff -->

    <!-- font awesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- preload my photo so it's ready ASAP -->
    <link rel="preload" href="/assets/me-4125x4125.jpg" as="image" />

    <!-- help robots and search engines understand who i am -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Cevdet Baran Oral - Portfolio",
            "url": "https://cevdetbaran.com/",
            "description": "Full-stack developer portfolio showcasing SaaS platforms, AI products, and cloud systems.",
            "inLanguage": "en"
          },
          {
            "@type": "Person",
            "name": "Cevdet Baran Oral",
            "url": "https://cevdetbaran.com/",
            "image": "https://cevdetbaran.com/assets/me-4125x4125.jpg",
            "jobTitle": "Full-Stack Developer",
            "description": "Full-stack developer experienced in building SaaS platforms, mobile applications, and AI-powered products with React, React Native, Node.js, Python, and AWS.",
            "knowsAbout": [
              "React",
              "React Native",
              "Node.js",
              "Python",
              "FastAPI",
              "AWS",
              "Docker",
              "TypeScript",
              "Machine Learning",
              "LangChain",
              "PostgreSQL",
              "MongoDB"
            ],
            "sameAs": [
              "https://github.com/BaranDev",
              "https://www.linkedin.com/in/cevdetbaranoral"
            ],
            "alumniOf": [
              {
                "@type": "CollegeOrUniversity",
                "name": "Eastern Mediterranean University",
                "url": "https://www.emu.edu.tr"
              },
              {
                "@type": "CollegeOrUniversity",
                "name": "Ufuk University",
                "url": "https://www.ufuk.edu.tr"
              }
            ],
            "award": [
              "Best Graduation Project Award - TaksiKıbrıs",
              "Teknofest 2024 Finalist - Top 2%",
              "EMUCON Festival - High Success Award",
              "FutureMinds'25 Hackathon - 3rd Place"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
